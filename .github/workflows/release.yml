name: Release

# Tag `v1.2.3` → signed release APK + SHA256SUMS.txt as a GitHub Release (docs/01 §Build & Release).
# versionName comes from the tag, versionCode from the workflow run number (monotonic per repository).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TL_VERSION_NAME: ${{ github.ref_name }}
      TL_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          TL_KEYSTORE_BASE64: ${{ secrets.TL_KEYSTORE_BASE64 }}
          TL_KEYSTORE_PASSWORD: ${{ secrets.TL_KEYSTORE_PASSWORD }}
          TL_KEY_ALIAS: ${{ secrets.TL_KEY_ALIAS }}
          TL_KEY_PASSWORD: ${{ secrets.TL_KEY_PASSWORD }}
        run: |
          for name in TL_KEYSTORE_BASE64 TL_KEYSTORE_PASSWORD TL_KEY_ALIAS TL_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing — see docs/01-architektur.md §Signing"; missing=1
            fi
          done
          [ -z "$missing" ]

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify keystore and passwords
        env:
          TL_KEYSTORE_BASE64: ${{ secrets.TL_KEYSTORE_BASE64 }}
          TL_KEYSTORE_PASSWORD: ${{ secrets.TL_KEYSTORE_PASSWORD }}
          TL_KEY_ALIAS: ${{ secrets.TL_KEY_ALIAS }}
          TL_KEY_PASSWORD: ${{ secrets.TL_KEY_PASSWORD }}
        run: |
          # Fail here with a precise reason instead of deep inside Gradle's packageRelease.
          set +e
          printf '%s' "$TL_KEYSTORE_BASE64" | base64 -d > /tmp/release.jks 2>/tmp/b64.err
          if [ $? -ne 0 ] || [ ! -s /tmp/release.jks ]; then
            echo "::error::TL_KEYSTORE_BASE64 is not valid base64 (re-run: base64 -i terminal-linker.jks | gh secret set TL_KEYSTORE_BASE64)"; exit 1
          fi
          echo "keystore: $(wc -c < /tmp/release.jks) bytes"
          store_pw="$(printf '%s' "$TL_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          key_pw="$(printf '%s' "$TL_KEY_PASSWORD" | tr -d '\r\n')"
          alias="$(printf '%s' "$TL_KEY_ALIAS" | tr -d '\r\n')"
          if ! keytool -list -keystore /tmp/release.jks -storepass "$store_pw" > /tmp/list.txt 2>&1; then
            echo "::error::TL_KEYSTORE_PASSWORD does not open the keystore (keytool: $(tail -1 /tmp/list.txt))"; exit 1
          fi
          if ! keytool -list -keystore /tmp/release.jks -storepass "$store_pw" -alias "$alias" > /dev/null 2>&1; then
            echo "::error::TL_KEY_ALIAS '$alias' not found in the keystore; entries: $(grep -i 'PrivateKeyEntry' /tmp/list.txt | cut -d, -f1 | tr '\n' ' ')"; exit 1
          fi
          if ! keytool -exportcert -rfc -keystore /tmp/release.jks -storepass "$store_pw" -keypass "$key_pw" -alias "$alias" > /dev/null 2>/tmp/key.err; then
            echo "::error::TL_KEY_PASSWORD does not unlock the key (keytool: $(tail -1 /tmp/key.err))"; exit 1
          fi
          rm -f /tmp/release.jks /tmp/list.txt
          echo "Keystore, alias and passwords verified."

      - name: Unit tests and lint
        run: ./gradlew ktlintCheck test --no-daemon

      - name: Assemble signed release APK
        env:
          TL_KEYSTORE_BASE64: ${{ secrets.TL_KEYSTORE_BASE64 }}
          TL_KEYSTORE_PASSWORD: ${{ secrets.TL_KEYSTORE_PASSWORD }}
          TL_KEY_ALIAS: ${{ secrets.TL_KEY_ALIAS }}
          TL_KEY_PASSWORD: ${{ secrets.TL_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name artefacts and compute checksums
        run: |
          version="${TL_VERSION_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/wallee-terminal-linker-${version}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${version}.txt"
          (cd dist && sha256sum "wallee-terminal-linker-${version}.apk" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Refuse to publish an APK that was not signed with the release key.
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs \
            "dist/wallee-terminal-linker-${version}.apk" | tee dist/certs.txt
          if grep -q "CN=Android Debug" dist/certs.txt; then echo "::error::APK is debug-signed"; exit 1; fi
          rm dist/certs.txt
          # The license list must be inside the APK (it was missing in 1.0.0 on a clean build).
          if ! unzip -l "dist/wallee-terminal-linker-${version}.apk" | grep -q "assets/oss_licenses.json"; then
            echo "::error::assets/oss_licenses.json is missing from the APK"; exit 1
          fi

      - name: Release notes from CHANGELOG
        run: |
          version="${TL_VERSION_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then echo "Release ${TL_VERSION_NAME}" > dist/notes.md; fi
          printf '\n---\nSHA-256:\n```\n%s```\n' "$(cat dist/SHA256SUMS.txt)" >> dist/notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/wallee-terminal-linker-*.apk
            dist/SHA256SUMS.txt
            dist/mapping-*.txt
